name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Intalação de dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
      
      - name: Run Tests
        env:
          DJANGO_SETTINGS_MODULE: core.settings
        run: |
          pytest
